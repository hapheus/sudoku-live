name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-and-build:
    name: Unit Tests & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

  itch-package:
    name: itch.io ZIP Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:itch
      - run: npm run verify:itch

      - uses: actions/upload-artifact@v7
        with:
          name: sudoku-shift-itch-zip
          path: sudoku-shift-itch.zip
          if-no-files-found: error
          retention-days: 7

  docker-smoke:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Docker Compose configurations
        run: |
          docker compose config -q
          docker compose -f compose.prod.yml config -q

      - name: Start Docker Compose stack and verify endpoints
        run: |
          set -euo pipefail
          trap 'docker compose logs --no-color; docker compose down -v' EXIT

          docker compose up -d --build

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/up >/dev/null && curl -fsS http://127.0.0.1:8081/health >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8000/up | grep -q "ok"
          curl -fsS http://127.0.0.1:8000/env-config.js | grep -q "window.__APP_CONFIG__"
          curl -fsS http://127.0.0.1:8081/health >/dev/null

  e2e-playwright:
    name: Playwright E2E & Accessibility
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Chromium
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}

      # The chromium channel uses the full browser in headless mode.
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run e2e -- --ignore-snapshots --workers=2 --reporter=list

      - name: Start isolated convergence broker
        run: |
          docker compose -p sudoku-convergence-qa run --no-deps --detach --name sudoku-convergence-qa -p 127.0.0.1:17881:8080 centrifugo
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:17881/health

      - name: Verify concurrent edits and exhausted-history recovery
        run: SYNC_E2E=1 npx playwright test --config playwright.sync.config.ts

      - name: Stop isolated convergence broker
        if: always()
        run: |
          docker rm -f sudoku-convergence-qa || true
          docker compose -p sudoku-convergence-qa down --remove-orphans

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  benchmark-playwright-image:
    name: Benchmark Playwright image setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pull version-matched Playwright image
        run: |
          version=$(jq -er '.packages["node_modules/@playwright/test"].version' package-lock.json)
          docker pull "mcr.microsoft.com/playwright:v${version}-noble"

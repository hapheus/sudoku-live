name: Release, itch.io & Docker Hub Publish

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to upload to itch.io (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-release:
    name: Create Release from Conventional Commits
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compute next version and create GitHub Release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT_VERSION="$(node scripts/next-release-version.mjs)"
          if [ -z "$NEXT_VERSION" ]; then
            echo "No releasable commits (feat/fix/perf/breaking) since last tag. Skipping release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="v${NEXT_VERSION}"
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  itch-upload:
    name: Upload HTML5 Build to itch.io
    needs: auto-release
    if: >
      always() &&
      (
        (github.event_name == 'release' && github.event.action == 'published') ||
        (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
        (github.event_name == 'push' && needs.auto-release.outputs.released == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:itch
      - run: npm run verify:itch

      - name: Install itch.io butler
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o butler.zip "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default"
          unzip -q butler.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/butler"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Push build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.auto-release.outputs.tag) }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::BUTLER_API_KEY secret is not configured."
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          butler push dist-itch hapheus/sudoku-shift:html5 --userversion "$VERSION"

  dockerhub-publish:
    name: Publish Docker Image & Description to Docker Hub
    needs: auto-release
    if: >
      always() &&
      (
        (github.event_name == 'release' && github.event.action == 'published') ||
        (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
        (github.event_name == 'push' && needs.auto-release.outputs.released == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}

      - name: Check Docker Hub secret
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_TOKEN secret is not configured."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: hapheus
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute Docker tags
        id: docker_tags
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.auto-release.outputs.tag) }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          {
            echo "tags<<EOF"
            echo "hapheus/sudoku-shift:latest"
            echo "hapheus/sudoku-shift:${VERSION}"
            echo "hapheus/sudoku-shift:v${VERSION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: hapheus
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: hapheus/sudoku-shift
          readme-filepath: ./DOCKERHUB.md
          short-description: "Runnable Sudoku Shift container (Game Off 2026) with configurable Centrifugo WebSocket URL"

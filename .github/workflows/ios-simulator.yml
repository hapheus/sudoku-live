name: iOS Capacitor & Simulator Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: iOS Capacitor & Simulator Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: ruby -c ios/fastlane/Fastfile
      - run: npm run ios:preflight
      - run: cd ios && fastlane simulator

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sudoku-live-app
    restart: unless-stopped
    depends_on:
      centrifugo:
        condition: service_healthy
    networks:
      - default
      - cf-tunnel-net
    environment:
      APP_NAME: "Sudoku Live"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY (e.g. php artisan key:generate --show)}
      APP_URL: "https://sudoku.${DOMAIN_NAME:?Set DOMAIN_NAME}"
      CACHE_STORE: file
      SESSION_DRIVER: cookie
      SESSION_SECURE_COOKIE: "true"
      BROADCAST_CONNECTION: null
      QUEUE_CONNECTION: sync
      # Internal Docker network communication (app -> centrifugo:8080)
      CENTRIFUGO_INTERNAL_URL: "http://centrifugo:8080"
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?Set CENTRIFUGO_API_KEY}
      CENTRIFUGO_HMAC_SECRET: ${CENTRIFUGO_HMAC_SECRET:?Set CENTRIFUGO_HMAC_SECRET}
      # Public browser / mobile WebSocket endpoint via Cloudflare Tunnel
      CENTRIFUGO_PUBLIC_HOST: "sudoku-ws.${DOMAIN_NAME:?Set DOMAIN_NAME}"
      CENTRIFUGO_PUBLIC_PORT: "443"
      CENTRIFUGO_PUBLIC_SCHEME: "https"
    labels:
      cf.tunnel.hostname: "sudoku.${DOMAIN_NAME:?Set DOMAIN_NAME}"
      cf.tunnel.port: "8000"
      cf.tunnel.protocol: "http"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: sudoku-live-centrifugo
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    restart: unless-stopped
    networks:
      - default
      - cf-tunnel-net
    volumes:
      - ./docker/centrifugo/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?Set CENTRIFUGO_API_KEY}
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_HMAC_SECRET:?Set CENTRIFUGO_HMAC_SECRET}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "https://sudoku.${DOMAIN_NAME:?Set DOMAIN_NAME}"
    labels:
      cf.tunnel.hostname: "sudoku-ws.${DOMAIN_NAME:?Set DOMAIN_NAME}"
      cf.tunnel.port: "8080"
      cf.tunnel.protocol: "http"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  cf-tunnel-net:
    external: true

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sudoku-live-app
    restart: unless-stopped
    depends_on:
      centrifugo:
        condition: service_healthy
    networks:
      - default
      - cf-tunnel-net
    environment:
      WS_HOST: "sudoku-ws.${DOMAIN_NAME:?Set DOMAIN_NAME}"
      WS_PORT: "443"
      WS_SCHEME: "https"
      PUBLIC_APP_URL: "https://sudoku.${DOMAIN_NAME:?Set DOMAIN_NAME}"
    labels:
      cf.tunnel.hostname: "sudoku.${DOMAIN_NAME:?Set DOMAIN_NAME}"
      cf.tunnel.port: "8000"
      cf.tunnel.protocol: "http"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: sudoku-live-centrifugo
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    restart: unless-stopped
    networks:
      - default
      - cf-tunnel-net
    volumes:
      - ./docker/centrifugo/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "https://sudoku.${DOMAIN_NAME:?Set DOMAIN_NAME} capacitor://localhost https://localhost http://localhost"
    labels:
      cf.tunnel.hostname: "sudoku-ws.${DOMAIN_NAME:?Set DOMAIN_NAME}"
      cf.tunnel.port: "8080"
      cf.tunnel.protocol: "http"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  cf-tunnel-net:
    external: true

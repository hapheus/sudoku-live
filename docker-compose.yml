services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sudoku-live-app
    restart: unless-stopped
    depends_on:
      centrifugo:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      WS_HOST: "localhost"
      WS_PORT: "8081"
      WS_SCHEME: "http"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: sudoku-live-centrifugo
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./docker/centrifugo/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
